name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # A workflow GitHub cannot parse fails on every push to every branch, named by its file
      # path, with no useful error. Cheap to check here; expensive to diagnose from notifications.
      - name: Workflows
        run: python3 scripts/check-workflows.py

      - name: Format
        run: npm run format:check

      - name: Build and typecheck
        run: npm run build

      # Separate from the build: the build project's rootDir is src/, so test/ is outside it.
      # Without this step a `@ts-expect-error` in a test is inert and passes either way.
      - name: Typecheck tests
        run: npm run typecheck:test

      - name: JSON Schema drift
        run: npm run schema:check

      - name: Test
        run: npm test

  # The release gate (issue #29 item 4, ADR-0022).
  #
  # npm workspaces symlink every package into the root node_modules, so the `verify` job above
  # can pass while a published tarball is broken. This job installs what a consumer installs.
  clean-consumer:
    name: clean consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Report the publish set
        run: node scripts/publish-set.mjs

      - name: Clean-consumer gate
        run: node scripts/clean-consumer.mjs

  version-bump:
    name: version bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ADR-0050: the `next` line publishes on merge, so a merge that changes shipped contents
      # without a bump ships nothing and says nothing. Checked on the pull request rather than the
      # merge — before `main` can go red for it, and where fixing it is one line in a diff already
      # open. `files`-scoped, so a test-only or docs-only change to a published package does not
      # fire.
      - name: Shipped changes carry a version bump
        run: node scripts/check-version-bump.mjs "origin/${{ github.base_ref }}"

  breaking-notes:
    name: breaking notes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # The base is built in a worktree to compare compiler output against compiler output, so
          # its history must be present. A shallow clone once turned a release check into one that
          # passed and could not have failed (#175).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # The surface has to come from the compiler, so HEAD is built before it is read. Comparing
      # source would answer a different question, and the script declines rather than reporting a
      # clean surface if either side fails to build.
      - name: Build
        run: npm run build

      # `0.2.0-next.21` shipped eight breaking signature changes with notes describing one. The
      # adopter asked in advance what the release contained, got no answer in time, bumped on a
      # summary, and found the rest by compiling. Three humans in the loop failed to surface it and
      # the compiler was the only mechanism that did — and a pinned adopter is, by construction,
      # the last party to know and cannot volunteer the information. So the detection moves here.
      - name: A breaking surface change carries a BREAKING entry
        run: node scripts/check-breaking-notes.mjs "origin/${{ github.base_ref }}"

  boundary:
    name: core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Architecture contract §4.2: Aldus Core must not name a provider, platform,
      # cloud service, or adopter identity. See CLAUDE.md "The boundary".
      #
      # The inline pattern this replaces was named "Reject adopter-specific names" and its comment
      # said it covered adopter identity. It contained eleven provider, platform and cloud names
      # and no adopter, and it scanned `packages/` only — so two files reached `main` naming an
      # adopter's repository, one of them in `docs/` (#173). The list now lives in one place with
      # a per-category scope, so what the step claims and what it checks cannot drift apart.
      - name: Reject provider, platform, cloud and adopter names
        run: node scripts/check-generic-boundary.mjs
