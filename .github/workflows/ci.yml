name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # A workflow GitHub cannot parse fails on every push to every branch, named by its file
      # path, with no useful error. Cheap to check here; expensive to diagnose from notifications.
      - name: Workflows
        run: python3 scripts/check-workflows.py

      - name: Format
        run: npm run format:check

      - name: Build and typecheck
        run: npm run build

      # Separate from the build: the build project's rootDir is src/, so test/ is outside it.
      # Without this step a `@ts-expect-error` in a test is inert and passes either way.
      - name: Typecheck tests
        run: npm run typecheck:test

      - name: JSON Schema drift
        run: npm run schema:check

      - name: Test
        run: npm test

  # The release gate (issue #29 item 4, ADR-0022).
  #
  # npm workspaces symlink every package into the root node_modules, so the `verify` job above
  # can pass while a published tarball is broken. This job installs what a consumer installs.
  clean-consumer:
    name: clean consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Report the publish set
        run: node scripts/publish-set.mjs

      - name: Clean-consumer gate
        run: node scripts/clean-consumer.mjs

  boundary:
    name: core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Architecture contract §4.2: Aldus Core must not name a provider, platform,
      # cloud service, or adopter identity. See CLAUDE.md "The boundary".
      - name: Reject adopter-specific names in packages/
        run: |
          set -o pipefail
          pattern='elevenlabs|openai|anthropic|google[ -]?cloud|firestore|\bgcs\b|\bs3\b|youtube|spotify|soundcloud|apple[ -]?podcast'
          if grep -rniE "$pattern" packages/ --include='*.ts' --include='*.json' --include='*.md' \
               --exclude-dir=node_modules --exclude-dir=dist; then
            echo "::error::Aldus Core must stay generic (architecture contract §4.2)."
            exit 1
          fi
          echo "No provider, platform, or adopter identifiers found in packages/."
