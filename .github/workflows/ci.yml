name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Build and typecheck
        run: npm run build

      - name: JSON Schema drift
        run: npm run schema:check

      - name: Test
        run: npm test

  boundary:
    name: core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Architecture contract §4.2: Aldus Core must not name a provider, platform,
      # cloud service, or adopter identity. See CLAUDE.md "The boundary".
      - name: Reject adopter-specific names in packages/
        run: |
          set -o pipefail
          pattern='elevenlabs|openai|anthropic|google[ -]?cloud|firestore|\bgcs\b|\bs3\b|youtube|spotify|soundcloud|apple[ -]?podcast'
          if grep -rniE "$pattern" packages/ --include='*.ts' --include='*.json' --include='*.md' \
               --exclude-dir=node_modules --exclude-dir=dist; then
            echo "::error::Aldus Core must stay generic (architecture contract §4.2)."
            exit 1
          fi
          echo "No provider, platform, or adopter identifiers found in packages/."
