# The `next` line publishes unattended on merge to `main` (ADR-0050). Every readiness check and the
# clean-consumer gate still run before the publish, and the tarball is still uploaded for
# inspection — what was removed is a human countersignature on a line that is unvalidated by
# construction, not a check.
#
# This header previously said "Nothing here runs `npm publish` until a human approves the
# `npm-publish` environment". That became false the moment the required reviewer was removed, and a
# false safety claim in a release pipeline is relied on rather than merely read (#173).
#
# Nothing here assigns `latest`. Promotion is ADR-0042's interactive script with npm 2FA,
# deliberately outside CI. See docs/RELEASING.md.
name: Release

# Merge-triggered on `main`, never on pull_request, never on a fork: a workflow that can publish
# must not be reachable from a branch anyone can open (issue #29 item 5, ADR-0022).
#
# The reviewed merge is the publish event (ADR-0050). Tag pushes no longer publish: with the
# environment reviewer gone, a tag was an out-of-band publish button any account with write access
# could press, which is every session authenticating as the owner.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and pack, then stop before publishing"
        type: boolean
        default: true
      allow-latest-move:
        description: "Permit the latest dist-tag to move (a deliberate promotion, or a first publish)"
        type: boolean
        default: false

# Least privilege at the top; the publish job adds id-token below.
permissions:
  contents: read

# One release at a time. Two runs publishing the same version race, and the loser reports a
# confusing 403 rather than the duplicate it actually is.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------------
  # Everything that can fail, fails here — before any credential is minted.
  # ---------------------------------------------------------------------------------------------
  verify:
    name: verify and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.readiness.outputs.version }}
      publish: ${{ steps.intent.outputs.publish }}
    steps:
      # Full history: `release-intent.mjs` reads the previous commit's version, and the default
      # shallow clone does not contain it. That is why the first run after the trigger moved
      # reported an attempted republish for a merge that changed nothing shippable.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Full verification
        run: npm run verify

      - name: Release readiness
        id: readiness
        run: |
          set -euo pipefail
          node scripts/publish-set.mjs --strict
          version="$(node -p "require('./packages/aldus-core/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"

      # Did this merge intend to ship, and can it? (ADR-0050)
      #
      # Three states, and conflating any two breaks something: version unchanged publishes nothing
      # and succeeds; bumped and absent from the registry publishes; bumped and *wholly* present
      # refuses, because that is a republish. The whole-set qualifier is what preserves the
      # per-package skip below, which exists so a twelve-package set that failed halfway resumes
      # instead of dying on its own earlier success.
      - name: Release intent
        id: intent
        run: |
          set -euo pipefail
          node scripts/release-intent.mjs "${{ github.event.before }}" | tee /tmp/intent.txt
          grep '^publish=' /tmp/intent.txt >> "$GITHUB_OUTPUT"

      - name: Tag matches the manifests
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.readiness.outputs.version }}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag v${tag} does not match the manifest version ${version}"
            exit 1
          fi
          echo "Tag v${tag} matches the manifests."

      - name: Clean-consumer gate
        run: node scripts/clean-consumer.mjs

      - name: Pack for inspection
        run: |
          set -euo pipefail
          node scripts/pack.mjs --out "${RUNNER_TEMP}/tarballs"
          ls -la "${RUNNER_TEMP}/tarballs"

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: tarballs-${{ steps.readiness.outputs.version }}
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------------------------
  # Publishing. The `npm-publish` Environment carries **no required reviewers** — measured:
  # `protection_rules[].type` returns `branch_policy` and nothing else. Its only rule is a
  # deployment branch policy.
  #
  # This comment previously said the Environment enforced the owner's approval. That became false
  # when the required reviewer was removed for ADR-0050, and the header above corrected the same
  # claim in the same edit while this one, 120 lines down, was missed. Both were describing a
  # control that no longer existed. What gates a publish now is: `needs: verify`, so every
  # readiness check and the clean-consumer gate run first; `verify.outputs.publish`, which is false
  # unless the merge bumped a version; `release-intent`, which refuses a version already on the
  # registry; and `--tag next`, so nothing here can move `latest`.
  #
  # A false safety claim in a release pipeline is relied on rather than merely read (#173), so this
  # block states what is measured rather than what was once configured.
  # ---------------------------------------------------------------------------------------------
  publish:
    name: publish to npm (next)
    needs: verify
    if: |
      (github.event_name == 'push' && needs.verify.outputs.publish == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/org/aldus-runtime
    permissions:
      contents: read
      # The OIDC token npm exchanges for short-lived publish rights. This is what removes the
      # need for a long-lived automation token in repository secrets (ADR-0022).
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Re-checked on this job rather than trusted from `verify`, because this is the last point
      # before an irreversible act and the two jobs check out independently. The reason used to be
      # that an environment approval could arrive hours later; there is no approval now, and the
      # re-check is right regardless of the delay (ADR-0050).
      - name: Release readiness
        run: node scripts/publish-set.mjs --strict

      - name: Ensure npm is new enough for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      # Recorded before and after, and asserted afterwards (ADR-0023 decision 4). The 0.1.0
      # bootstrap published with --tag next and still moved latest, because npm creates latest
      # on a package's first publish. Nothing in the pipeline noticed at the time.
      #
      # The snapshot now **refuses** when any package cannot be read, rather than recording the
      # failure as "no tags". A baseline with holes cannot detect a tag that moved: a registry
      # blip here used to record an absence and every later comparison held.
      - name: Record dist-tags before publishing
        run: |
          set -euo pipefail
          node scripts/dist-tags.mjs snapshot "${RUNNER_TEMP}/dist-tags-before.json"

      # --tag next, never latest. Nothing becomes the default install until the owner promotes it
      # after adopter smoke tests (ADR-0020, ADR-0022, ADR-0023).
      - name: Publish
        run: |
          set -euo pipefail
          node scripts/publish-dirs.mjs > "${RUNNER_TEMP}/publish-dirs.txt"
          while IFS= read -r dir; do
            [ -n "${dir}" ] || continue
            name="$( cd "${dir}" && node -p "require('./package.json').name" )"
            version="$( cd "${dir}" && node -p "require('./package.json').version" )"

            # Skip what is already on the registry, so a release resumes instead of dying on its
            # own earlier success. A publish set is twelve separate writes and any of them can
            # fail — a missing trusted publisher, a network blip, a rate limit — and without this
            # the retry stops on the first package that worked last time. Matched on the exact
            # name@version, so this can never skip a version that has not actually been published.
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "already published, skipping: ${name}@${version}"
              continue
            fi

            echo "::group::publish ${dir}"
            ( cd "${dir}" && npm publish --tag next --access public --provenance )
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/publish-dirs.txt"

      # Asserts **both** invariants for every package: `latest` is exactly what was recorded
      # before the publish, and `next` is exactly the version this tree intended to publish.
      # `allow-latest-move` is a deliberate input, so a legitimate promotion states its intent
      # rather than being inferred from the outcome. It does not relax the `next` assertion.
      #
      # The second invariant is why this step was rewritten. Run 33470723600 published all twelve
      # packages as 0.2.0-next.53 and this step went green while printing `next: 0.2.0-next.52`
      # for two of them — `next` was printed and never compared. The `latest` comparison it did
      # make was reading `undefined` on both sides, because the `npm install -g npm@latest` step
      # above puts npm 12 on the runner and npm 12 wraps `view --json` output in an array. Both
      # are in `scripts/dist-tags-check.mjs`, measured.
      #
      # The registry can serve a stale `next` after a successful publish — measured at about five
      # minutes for one package out of twelve, twice in one day (#266, runs 33583936736 and
      # 33593065914) — so the assertion re-reads what has not converged on a bounded schedule. It
      # never infers success from the publish command.
      #
      # Three exit codes. 0 passes. 1 is a real failure — `latest` moved, `next` is a version this
      # publish neither intended nor recorded, a package stayed absent — and stays red. 2 is
      # DECLINED: the bound ran out with a package still serving exactly the pre-publish `next`,
      # which a slow registry and a partial publish both look like from here.
      #
      # The job goes red on 2 as well, deliberately: a declined result is not folded into a pass,
      # and this workflow has no green that means "unknown". What the branch below adds is the
      # distinction a reader needs at a glance — a step-summary section and an annotation saying
      # the Publish step succeeded and how to re-check — so a red run no longer has to be
      # re-measured by hand to learn which of the two it was. The Publish step precedes this one
      # under `set -e`, so reaching here is what "the publish step succeeded" rests on.
      - name: Assert dist-tags after publishing
        run: |
          set -euo pipefail
          status=0
          node scripts/dist-tags.mjs assert "${RUNNER_TEMP}/dist-tags-before.json" \
            ${{ inputs.allow-latest-move && '--allow-latest-move' || '' }} || status=$?
          if [ "${status}" -eq 2 ]; then
            {
              echo "### DECLINED: dist-tags not yet converged for ${{ needs.verify.outputs.version }}"
              echo
              echo "The Publish step succeeded for every package. The assertion ran to its convergence"
              echo "bound with at least one package still serving the pre-publish \`next\`; the step log"
              echo "names them. This is neither a pass nor a failure, and the job is red because a"
              echo "declined result is never folded into a pass."
              echo
              echo "Re-check: \`npm view @aldus-runtime/<pkg> dist-tags\` — expect"
              echo "\`next=${{ needs.verify.outputs.version }}\`. See docs/RELEASING.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=dist-tags DECLINED::next not yet converged on at least one package; the Publish step succeeded. Neither a pass nor a failure - see the step log and summary."
          fi
          exit "${status}"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### Published ${{ needs.verify.outputs.version }} to \`next\`"
            echo
            echo "Nothing was assigned to \`latest\`. Promote only after adopter smoke tests"
            echo "and the owner's approval — see docs/RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"
